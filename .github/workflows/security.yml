name: Security
run-name: Security · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  push:
    branches:
      - master
  schedule:
    - cron: "16 21 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each trusted-ref scan completes, including scheduled and manual scans.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  codeql:
    name: CodeQL Swift
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Expected Xcode not found at $DEVELOPER_DIR"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        run: make build-quiet

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift

  codacy:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip when Codacy token is unavailable
        if: env.CODACY_PROJECT_TOKEN == ''
        run: echo "CODACY_PROJECT_TOKEN is not configured; skipping Codacy scan."

      - name: Run Codacy Analysis CLI
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
